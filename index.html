<!doctype html>
<html lang="en">
    <!-- This template allows you to create a SIMPLE 6DOF webXR environment with a single .glb file and a equirectangular image for the sky. By gregory vershbow, made with resources from three.js a-frame.io and silverslade -->
    <!-- If exporting from blender be sure to merge all animation tracks -->
    <!-- Creative Commons -->
    
    <head>
        <title>WebXR Application</title>
        <link rel="icon" type="image/png" href="favicon.ico"/>
        <meta name="description" content="3D Application">
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
       <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

		<script type="text/javascript" src="depricated/jscamera-cube-env.js"></script>
    </head>
   
    <body>
        <a-scene inspector="url: https://jsdelivr.net">
            
            <!-- Assets -->
            <a-assets>

                <a-asset-item id="navmesh-asset" src="./assets/Nav.glb"></a-asset-item> 
                <img id="sky"                 src="./assets/sky.jpg">
                <img id="icon-play"           src="./resources/play.png">
                <img id="icon-pause"          src="./resources/pause.png">
                <img id="icon-play-skip-back" src="./resources/play-skip-back.png">
                <img id="icon-mute"           src="./resources/mute.png">
                <img id="icon-volume-low"     src="./resources/volume-low.png">
                <img id="icon-volume-high"    src="./resources/volume-high.png">
            </a-assets>

            <!-- Entities -->
            <!-- Note for reflections: To change reflections Replace "g_cube" with "soft_city","soft_landscape" or "soft_room"-->
            
            
            
            
            
            <a-sphere position="0 1.25 -5" radius="1.25" scale=".5 .5 .5" color="#EF2D5E"></a-sphere>

</html>
